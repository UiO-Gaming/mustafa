[project]
name = "mustafa"
version = "0.1.0"
description = "UiO Gaming Discord Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.*",
    "dateparser==1.4.*",
    "discord.py==2.7.*",
    "graphviz==0.21.*",
    "Japanera==2.1.*",
    "mcrcon==0.7.*",
    "moviepy==2.2.*",
    "nltk==3.10.*",
    "numpy==2.5.*",
    "opencv-python==5.0.*",
    "pillow>=9.2,<12.0",
    "psutil==7.2.*",
    "psycopg2-binary==2.9.*",
    "pypandoc==1.17.*",
    "pyyaml==6.0.*",
    "regex==2026.9.29",
    "tzdata",  # This only needed if run on windows. I haven't set a version either to ensure it's up to date.
    "wordcloud==1.9.*",
    "yt-dlp==2026.10.21",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.*",
]

[tool.black]
line-length = 120

[tool.isort]
atomic = true
profile = "black"
line_length = 120
force_single_line = true
known_first_party = ["black"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Keep the rule set ruff used before v0.17 expanded its defaults
select = ["E4", "E7", "E9", "F"]
